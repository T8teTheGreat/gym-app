<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">

    <!-- Favicons & Shortcuts -->
    <link rel="shortcut icon" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <title>Minimal Gym</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header-container">
            <h1 id="view-title">Library</h1>
            <button id="dark-mode-toggle" class="dark-mode-toggle history-toggle">☀️</button>
        </header>

        <main id="main-content">
            <!-- Library View -->
            <section id="view-library">
                <input type="text" id="search-input" placeholder="Search exercises...">
                <select id="muscle-filter">
                    <option value="all">All Muscle Groups</option>
                    <!-- Options populated by JS -->
                </select>
                <div id="library-grid"></div>
            </section>

            <!-- Logger View -->
            <section id="view-logger" class="hidden">
                <div id="workout-name-input-container">
                    <input type="text" id="workout-name-input" placeholder="Name your workout (e.g. Back Day)" class="workout-name-input">
                </div>
                
                <div id="workout-exercises-list"></div>

                <div id="exercise-selection-container" class="exercise-selection-container">
                    <input type="text" id="logger-exercise-search" placeholder="Search for exercises by name..." class="logger-exercise-search">
                    <div id="logger-exercise-results" class="results-list hidden"></div>
                </div>
                
                <div id="exercise-info" class="info-box">
                    Select an exercise to see details.
                </div>

                <div id="sets-container">
                    <!-- Sets added here dynamically -->
                </div>
                
                <button id="add-set-btn" class="btn btn-add">+ Add Set</button>
                <button id="save-workout-btn" class="btn btn-secondary btn-save-workout">Save Workout</button>
            </section>

            <!-- History View -->
            <section id="view-history" class="hidden">
                <div id="history-list"></div>
            </section>
        </main>

        <nav>
            <button class="nav-item" id="nav-lib" onclick="showView('library')">
                <span>Library</span>
            </button>
            <button class="nav-item" id="nav-log" onclick="showView('logger')">
                <span>Log</span>
            </button>
            <button class="nav-item" id="nav-hist" onclick="showView('history')">
                <span>History</span>
            </button>
        </nav>
    </div>

    <!-- Script tags ordered correctly to avoid fetch CORS blocks on file:// -->
    <div id="toast-container"></div>
    <script type="module" src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('Service Worker registered');
          }).catch(err => {
            console.error('Service Worker registration failed:', err);
          });
        });
      }
    </script>
</body>
</html>
